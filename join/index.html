<style>
:root{
  --ink:#2a1846;--sun:#ffd84d;--sun2:#ffca30;--pink:#ff3d9a;--card:#ffffff;--text:#2a1846;--soft:#5b4f73;
  --well:#fff4c7;--glow:rgba(255,255,255,.6);--edge:#2a1846;--shadow:#2a1846;
  --display:"Bagel Fat One","Baloo 2",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--sun:#1b1031;--sun2:#22153f;--card:#2a1c4a;--text:#ffffff;--soft:#d6cdef;--well:#22163d;
    --glow:rgba(138,63,252,.3);--edge:#4b3a7a;--shadow:#0e0720;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
  font:600 1.0625rem/1.4 "Baloo 2",system-ui,sans-serif;color:var(--text);
  background:radial-gradient(circle at 50% 40%,var(--glow),rgba(0,0,0,0) 60%),
    repeating-conic-gradient(from 0deg at 50% 40%,var(--sun) 0deg 9deg,var(--sun2) 9deg 18deg) fixed;
  background-color:var(--sun);
}
main{
  width:100%;max-width:440px;padding:22px 22px 18px;text-align:center;
  background:var(--card);border:4px solid var(--edge);border-radius:28px;box-shadow:6px 6px 0 var(--shadow);
}
.logo{display:block;width:250px;max-width:80%;height:auto;margin:0 auto 4px}
h1{margin:4px 0 6px;font:400 clamp(1.9rem,8vw,2.4rem)/1.05 var(--display);letter-spacing:.01em}
.lede{margin:0 auto 16px;max-width:30ch;color:var(--soft)}
.room{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 18px;padding:10px 14px;
  background:var(--well);border:3px solid var(--edge);border-radius:18px}
.room small{font-weight:800;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
.room b{font:400 2.4rem/1 var(--display);letter-spacing:.16em;color:var(--pink);
  text-shadow:-2px 0 0 var(--ink),2px 0 0 var(--ink),0 -2px 0 var(--ink),0 2px 0 var(--ink),3px 3px 0 var(--ink)}
.btns{display:flex;flex-direction:column;gap:12px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:10px 20px 8px;
  border:4px solid var(--ink);border-radius:999px;box-shadow:4px 4px 0 var(--ink);
  font:400 1.35rem/1.1 var(--display);text-decoration:none;color:var(--ink);background:#fff;
  transition:transform .08s ease,box-shadow .08s ease;
}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible{outline:4px solid #2f55ff;outline-offset:3px}
.btn.hot{background:var(--pink);color:#fff;
  text-shadow:-2px 0 0 var(--ink),2px 0 0 var(--ink),0 -2px 0 var(--ink),0 2px 0 var(--ink)}
.btn small{display:block;font:700 .85rem/1.2 "Baloo 2",system-ui,sans-serif}
.btn.hot small{color:var(--ink);text-shadow:none}
.btn .stack{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.btn svg{flex:none}
@media (prefers-color-scheme:dark){
  .btn{border-color:#0e0720;box-shadow:4px 4px 0 #0e0720}
  .btn:not(.hot){background:#3a2766;color:#fff;border-color:#8d7fb0}
}
.open-app{display:inline-block;margin-top:14px;padding:6px;font-weight:800;color:var(--text);text-underline-offset:3px}
.hint{margin:10px auto 0;max-width:32ch;font-size:.95rem;color:var(--soft)}
.hint b{color:var(--text);letter-spacing:.08em}
footer{margin-top:16px;font-size:.85rem;font-weight:700;color:var(--soft)}
footer a{color:inherit}
[hidden]{display:none!important}
</style>
</head>

  <p class="hint" id="hint" hidden>Or open Facewise-XO and type <b id="code2"></b> in the Join box.</p>
  <footer>Niteshift Studio · <a href="../privacy-and-support.html">Privacy and support</a></footer>
</main>
<script>
(function () {
  var m = /[?&]room=([A-Za-z]{4})(?![A-Za-z])/.exec(location.search);
  var code = m ? m[1].toUpperCase() : '';
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!code) {                                    // no room in the link: just the game
    document.title = 'Facewise-XO';
    document.getElementById('title').textContent = 'Play Facewise-XO';
    document.getElementById('lede').textContent = 'Noughts and crosses on a rolling cube. Play in your browser or get the free app.';
    return;
  }
  document.title = 'Join room ' + code + ' on Facewise-XO';
  document.getElementById('code').textContent = code;
  document.getElementById('code2').textContent = code;
  document.getElementById('room').hidden = false;
  document.getElementById('hint').hidden = false;
  document.getElementById('play').href = '../play/?room=' + code;
  var open = document.getElementById('openApp');
  open.href = 'facewisexo://join?room=' + code;
  open.hidden = !ios;                             // the app is on iPhone and iPad only
})();
</script>
</body>
</html>
